<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1b3d" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ctext y=%2250%22 font-size=%2250%22%3E%F0%9F%91%91%3C/text%3E%3C/svg%3E" />
    <meta name="description" content="世界童話のキャラクターが現実の世界地図を旅して物件を買い漁る、風刺経済すごろく。" />
    <title>グローバル寓話大富豪 〜世界童話経済すごろく〜</title>
    <!-- The title screen's two big paintings. Declaring them here starts the connection and
         the download while the JS bundle is still parsing, which is the whole difference
         between a 2.8 s and a 1.4 s title on 4G. -->
    <link rel="preload" as="image" href="assets/ui/keyart.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="assets/ui/logo.webp" fetchpriority="high" />
    <!-- The seven menu icons the title paints. Starting them here means they are decoded by
         the time the bundle runs instead of costing seven more round trips after it. -->
    <link rel="preload" as="image" href="assets/ui/coins.webp" />
    <link rel="preload" as="image" href="assets/ui/chat.webp" />
    <link rel="preload" as="image" href="assets/ui/globe.webp" />
    <link rel="preload" as="image" href="assets/ui/hourglass.webp" />
    <link rel="preload" as="image" href="assets/ui/help.webp" />
    <link rel="preload" as="image" href="assets/ui/gear.webp" />
    <link rel="preload" as="image" href="assets/ui/trophy.webp" />
    <!-- Pre-JS boot paint: inline so the first frame does not wait for the bundled CSS.
         Uses #boot-screen ids so the bundled .boot-screen rules cannot restyle it. -->
    <style>
      #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        padding: 24px;
        background: radial-gradient(circle at 50% 38%, #174d91, #071225 72%);
        color: #ffe9a8;
        /* System font on purpose: the boot layer must not compete with the title art for
           bandwidth by triggering the 1.6 MB of Japanese webfont subsets. The app swaps to
           M PLUS Rounded 1c once the title is up. */
        font-family: 'Hiragino Maru Gothic ProN', 'Noto Sans JP', 'Yu Gothic', system-ui, sans-serif;
        font-weight: 700;
        text-align: center;
      }
      #boot-globe {
        font-size: 56px;
        line-height: 1;
        animation: boot-bob 2.4s ease-in-out infinite;
      }
      #boot-title { margin: 0; font-size: 20px; letter-spacing: 0.08em; }
      #boot-bar {
        width: min(320px, 74vw);
        height: 10px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.16);
        overflow: hidden;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.45);
      }
      #boot-fill {
        display: block;
        width: 4%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #ffd24a, #ffe9a8);
        transition: width 0.25s ease-out;
      }
      #boot-text { margin: 0; font-size: 14px; font-variant-numeric: tabular-nums; }
      #boot-joke { margin: 0; font-size: 12px; font-weight: 400; opacity: 0.72; min-height: 1.4em; }
      @keyframes boot-bob {
        0%, 100% { transform: translateY(0) rotate(-4deg); }
        50% { transform: translateY(-7px) rotate(4deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-globe { animation: none; }
        #boot-fill { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-screen" id="boot-screen">
        <div id="boot-globe" aria-hidden="true">🌍</div>
        <p id="boot-title">グローバル寓話大富豪</p>
        <div id="boot-bar" role="progressbar" aria-label="読み込み" aria-valuemin="0" aria-valuemax="100" aria-valuenow="4"><span id="boot-fill"></span></div>
        <p id="boot-text">世界地図を広げています…</p>
        <p id="boot-joke">地図係が倉庫から地球を出しています</p>
      </div>
    </div>
    <noscript>このゲームを遊ぶには JavaScript を有効にしてください。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
